<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Market Brief</title>
<meta name="description" content="日米の株価・金利・為替・物価を毎朝自動で集約するマーケット・ブリーフィング">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e2e0da;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --grid: #e6e4de;
  --accent: #2a78d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --up: #0a7d0a;
  --down: #c62f2f;
  --warn: #9a6400;
  --pos-bg: #e5f3e5;
  --neg-bg: #fbe7e7;
  --neu-bg: #eceae5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --border: #2f2f2c;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --grid: #2c2c29;
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
    --up: #3dbb3d;
    --down: #ef6b6b;
    --warn: #e0a42a;
    --pos-bg: #16301a;
    --neg-bg: #3a1c1c;
    --neu-bg: #262624;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --grid: #2c2c29;
  --accent: #3987e5; --series-1: #3987e5; --series-2: #d95926;
  --up: #3dbb3d; --down: #ef6b6b; --warn: #e0a42a;
  --pos-bg: #16301a; --neg-bg: #3a1c1c; --neu-bg: #262624;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin: 0 0 4px; }
h1 { font-size: 26px; line-height: 1.25; margin: 0; letter-spacing: .01em; }
.meta { color: var(--text-2); font-size: 12px; text-align: right; }
.meta button { font: inherit; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; margin-left: 6px; }
h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
h2 small { font-weight: normal; color: var(--text-3); font-size: 12px; }
section { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; margin-bottom: 16px; }
.grid2 > div, .grid2 > section { min-width: 0; }
.grid2 > section { margin-bottom: 0; }
.stack { display: grid; gap: 16px; margin-bottom: 16px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.headline { font-size: 18px; font-weight: 600; margin: 0 0 14px; }
.mood { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; white-space: nowrap; background: var(--neu-bg); }
.mood.pos { background: var(--pos-bg); color: var(--up); }
.mood.neg { background: var(--neg-bg); color: var(--down); }
.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.points li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.tag { font-size: 11px; font-weight: 600; text-align: center; border-radius: 4px; padding: 1px 6px; background: var(--neu-bg); color: var(--text-2); }
.tag.pos { background: var(--pos-bg); color: var(--up); }
.tag.neg { background: var(--neg-bg); color: var(--down); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 4px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--text-2); }
.tile .v { font-size: 22px; font-weight: 600; line-height: 1.3; }
.tile .s { font-size: 12px; color: var(--text-2); }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-size: 11px; font-weight: 600; color: var(--text-3); position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
td:first-child { font-weight: 600; }
td .sub { display: block; font-weight: normal; font-size: 11px; color: var(--text-3); }
tbody tr:last-child td { border-bottom: none; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--text-2); }
.hot { color: var(--warn); font-weight: 600; }
.spark { display: block; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--text-3); font-size: 10px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .zero { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin: 0 0 6px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top-style: dashed; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--surface); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 2; }
.tip b { font-weight: 600; }
.note { color: var(--text-3); font-size: 12px; margin: 8px 0 0; }
.callout { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-2); }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
a { color: var(--accent); }
footer { color: var(--text-3); font-size: 12px; margin-top: 24px; }
.skeleton { color: var(--text-3); padding: 40px 0; text-align: center; }

@media (max-width: 640px) {
  h1 { font-size: 21px; }
  .meta { text-align: left; }
  .hero { grid-template-columns: 1fr; }
  .points li { grid-template-columns: 1fr; gap: 2px; }
  .points .tag { justify-self: start; }
  section { padding: 14px 12px 10px; }
  .tile .v { font-size: 19px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Morning Market Brief</p>
      <h1 id="title">朝のマーケット・ブリーフィング</h1>
    </div>
    <div class="meta">
      <div id="generated">読み込み中…</div>
      <div>表示: <button type="button" id="theme-btn" aria-label="ライト/ダーク切替">テーマ切替</button></div>
    </div>
  </header>

  <main id="app"><p class="skeleton">データを読み込んでいます…</p></main>

  <footer>
    <p>データ: Yahoo Finance / FRED（セントルイス連銀）/ 財務省 国債金利情報 / 日本銀行 時系列統計 / 総務省 e-Stat。各値の日付は取得元の最新営業日です。
    本ページは情報提供のみを目的とした自動生成資料であり、投資判断はご自身の責任で行ってください。</p>
  </footer>
</div>

<script>
(() => {
  "use strict";
  // ---------- theme toggle (per-viewer convenience only)
  const root = document.documentElement;
  try { const t = localStorage.getItem("mmb-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById("theme-btn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("mmb-theme", root.dataset.theme); } catch (e) {}
  });

  // ---------- formatting helpers
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isNum = v => typeof v === "number" && isFinite(v);
  const fmt = (v, d = 2) => isNum(v) ? v.toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d }) : "—";
  const md = iso => iso ? `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}` : "—";
  const ym = iso => iso ? `${iso.slice(0, 4)}年${+iso.slice(5, 7)}月` : "—";
  const cls = v => !isNum(v) ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";
  const arrow = v => !isNum(v) ? "" : v > 0 ? "▲" : v < 0 ? "▼" : "";
  // signed change with arrow; unit e.g. "%", "bp"
  const chg = (v, d = 2, unit = "%") => isNum(v)
    ? `<span class="${cls(v)} num">${arrow(v)}${v > 0 ? "+" : ""}${fmt(v, d)}${unit}</span>`
    : `<span class="flat">—</span>`;
  const priceDigits = v => !isNum(v) ? 2 : Math.abs(v) >= 1000 ? 0 : Math.abs(v) >= 100 ? 2 : 2;

  // ---------- SVG helpers
  const NS = "http://www.w3.org/2000/svg";
  function sparkline(points, w = 110, h = 30) {
    if (!points || points.length < 2) return "";
    const ys = points.map(p => p[1]);
    const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
    const x = i => 2 + (i / (points.length - 1)) * (w - 6);
    const y = v => 3 + (1 - (v - min) / span) * (h - 6);
    const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    const first = ys[0], last = ys[ys.length - 1];
    const color = last >= first ? "var(--up)" : "var(--down)";
    const label = `${md(points[0][0])}〜${md(points[points.length - 1][0])}: ${fmt(first)} → ${fmt(last)}`;
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="6ヵ月推移 ${esc(label)}"><title>${esc(label)}</title>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.5" fill="${color}"/></svg>`;
  }

  /** Line chart with shared x categories or dates, one y axis, hover tooltip.
   *  series: [{name, color, dash, points:[[xLabel, y]], fmt}] */
  function lineChart(el, { series, height = 220, yUnit = "", refLine = null, xIsDate = false, yDigits = 2 }) {
    const W = 560, H = height, m = { t: 12, r: 44, b: 26, l: 40 };
    const xs = [...new Set(series.flatMap(s => s.points.map(p => p[0])))];
    if (xIsDate) xs.sort();
    const all = series.flatMap(s => s.points.map(p => p[1])).filter(isNum);
    if (refLine !== null) all.push(refLine);
    if (!all.length) { el.innerHTML = '<p class="note">データなし</p>'; return; }
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.12 || 0.5; lo -= pad; hi += pad;
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const X = i => m.l + (xs.length === 1 ? 0.5 : i / (xs.length - 1)) * (W - m.l - m.r);
    const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("role", "img");
    let s = '<g class="axis">';
    for (let v = lo; v <= hi + 1e-9; v += step) {
      s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`;
      s += `<text x="${m.l - 6}" y="${Y(v) + 3}" text-anchor="end">${fmt(v, step < 0.1 ? 2 : step < 1 ? 1 : 0)}${yUnit}</text>`;
    }
    const every = Math.max(1, Math.ceil(xs.length / 8));
    xs.forEach((x, i) => {
      if (i % every === 0 || i === xs.length - 1) {
        const lbl = xIsDate ? `${x.slice(2, 4)}/${+x.slice(5, 7)}` : x;
        s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(lbl)}</text>`;
      }
    });
    s += "</g>";
    if (refLine !== null && refLine >= lo && refLine <= hi) {
      s += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(refLine)}" y2="${Y(refLine)}"/>`;
      s += `<text x="${W - m.r + 4}" y="${Y(refLine) + 3}" font-size="10" fill="var(--text-3)">目標${refLine}%</text>`;
    }
    series.forEach(se => {
      const pts = se.points.filter(p => isNum(p[1])).map(p => [xs.indexOf(p[0]), p[1]]);
      if (!pts.length) return;
      const d = pts.map(([i, v], k) => `${k ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
      s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" ${se.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
      const [li, lv] = pts[pts.length - 1];
      if (!se.dash) s += `<circle cx="${X(li)}" cy="${Y(lv)}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`;
      if (se.label) s += `<text x="${X(li) + 7}" y="${Y(lv) + 4}" font-size="11" fill="var(--text-2)">${esc(se.label)}</text>`;
    });
    s += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-3)" stroke-width="1" opacity="0"/>`;
    s += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" class="hit"/>`;
    svg.innerHTML = s;
    el.innerHTML = "";
    el.appendChild(svg);
    const tip = document.createElement("div");
    tip.className = "tip";
    el.appendChild(tip);
    const cross = svg.querySelector(".cross");
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      let i = Math.round(((px - m.l) / (W - m.l - m.r)) * (xs.length - 1));
      i = Math.max(0, Math.min(xs.length - 1, i));
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 0.6);
      const rows = series.map(se => {
        const p = se.points.find(p => p[0] === xs[i]);
        return p && isNum(p[1]) ? `<div><span style="color:${se.color}">●</span> ${esc(se.name)}: <b>${fmt(p[1], yDigits)}${yUnit}</b></div>` : "";
      }).join("");
      tip.innerHTML = `<div>${esc(xIsDate ? ym(xs[i]) : xs[i])}</div>${rows}`;
      tip.style.opacity = 1;
      const left = (X(i) / W) * r.width;
      tip.style.left = Math.min(Math.max(0, left + 12), r.width - tip.offsetWidth) + "px";
      tip.style.top = "4px";
    };
    const hide = () => { tip.style.opacity = 0; cross.setAttribute("opacity", 0); };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerleave", hide);
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  // ---------- section renderers
  function priceTable(rows, { unitCol = false } = {}) {
    const head = `<tr><th>銘柄</th><th>終値</th><th>前日比</th><th>1週</th><th>1ヵ月</th><th>年初来</th>
      <th>52週高値比</th><th>25日線乖離</th><th>200日線乖離</th><th>RSI(14)</th><th>6ヵ月</th></tr>`;
    const body = rows.map(r => {
      const rsiCls = isNum(r.rsi14) && (r.rsi14 >= 70 || r.rsi14 <= 30) ? "hot" : "";
      const dev = v => isNum(v) && Math.abs(v) >= 5 ? `<span class="hot num">${v > 0 ? "+" : ""}${fmt(v, 1)}%</span>` : chg(v, 1);
      return `<tr>
        <td>${esc(r.name)}<span class="sub">${md(r.date)} · ${esc(r.source)}${unitCol && r.unit ? " · " + esc(r.unit) : ""}</span></td>
        <td class="num">${fmt(r.last, priceDigits(r.last))}</td>
        <td>${chg(r.chg_pct)}</td>
        <td>${chg(r.w1_pct, 1)}</td>
        <td>${chg(r.m1_pct, 1)}</td>
        <td>${chg(r.ytd_pct, 1)}</td>
        <td>${chg(r.from_high_pct, 1)}</td>
        <td>${dev(r.ma25_dev)}</td>
        <td>${dev(r.ma200_dev)}</td>
        <td class="num ${rsiCls}">${fmt(r.rsi14, 0)}</td>
        <td>${sparkline(r.spark)}</td>
      </tr>`;
    }).join("");
    return `<div class="tbl-wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
  }

  function rateTable(rows) {
    const head = `<tr><th>金利</th><th>水準</th><th>前日比</th><th>1週</th><th>1ヵ月</th><th>年初来</th><th>1年</th><th>6ヵ月</th></tr>`;
    const body = rows.map(r => `<tr>
        <td>${esc(r.name)}<span class="sub">${md(r.date)} · ${esc(r.source)}</span></td>
        <td class="num">${fmt(r.last, r.last < 10 && r.source === "財務省" ? 3 : 2)}%</td>
        <td>${chg(r.chg, 1, "bp")}</td>
        <td>${chg(r.w1, 0, "bp")}</td>
        <td>${chg(r.m1, 0, "bp")}</td>
        <td>${chg(r.ytd, 0, "bp")}</td>
        <td>${chg(r.y1, 0, "bp")}</td>
        <td>${sparkline(r.spark)}</td>
      </tr>`).join("");
    return `<div class="tbl-wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
  }

  function inflTable(rows) {
    const head = `<tr><th>指標</th><th>前年比</th><th>前月の前年比</th><th>3ヵ月前</th><th>前月比</th><th>3ヵ月年率</th></tr>`;
    const body = rows.map(r => {
      const trend = isNum(r.yoy) && isNum(r.yoy_3m_ago) ? r.yoy - r.yoy_3m_ago : null;
      return `<tr>
        <td>${esc(r.name)}<span class="sub">${ym(r.date)}分 · ${esc(r.source)}</span></td>
        <td class="num"><b>${fmt(r.yoy, 1)}%</b></td>
        <td class="num">${fmt(r.yoy_prev, 1)}%</td>
        <td class="num">${fmt(r.yoy_3m_ago, 1)}% ${isNum(trend) ? `<span class="${trend > 0 ? "down" : trend < 0 ? "up" : "flat"}">(${trend > 0 ? "+" : ""}${fmt(trend, 1)})</span>` : ""}</td>
        <td>${isNum(r.mom) ? chg(r.mom, 2) : "—"}</td>
        <td class="num">${isNum(r.ann3m) ? fmt(r.ann3m, 1) + "%" : "—"}</td>
      </tr>`;
    }).join("");
    return `<div class="tbl-wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
  }

  const get = (arr, k) => (arr || []).find(x => x.key === k);

  function render(d) {
    const c = d.commentary || { points: [] };
    const gen = new Date(d.generated_at);
    document.getElementById("generated").textContent =
      `更新: ${gen.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" })} JST`;
    document.getElementById("title").textContent =
      `${gen.toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo", month: "long", day: "numeric", weekday: "short" })}のマーケット・ブリーフィング`;
    const moodCls = c.risk_score > 0 ? "pos" : c.risk_score < 0 ? "neg" : "";
    const moodIcon = c.risk_score > 0 ? "▲" : c.risk_score < 0 ? "▼" : "◆";

    const n225 = get(d.equities, "n225"), spx = get(d.equities, "spx"), usdjpy = get(d.markets, "usdjpy"),
          vix = get(d.markets, "vix"), us10 = get(d.us_rates, "us10y"), jgb10 = get(d.jp_rates, "jgb10y");
    const tile = (k, v, s) => `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;
    const tiles = [
      n225 && tile(`日経平均 <span class="flat">(${md(n225.date)})</span>`, fmt(n225.last, 0), chg(n225.chg_pct)),
      spx && tile(`S&P 500 <span class="flat">(${md(spx.date)})</span>`, fmt(spx.last, 0), chg(spx.chg_pct)),
      usdjpy && tile(`ドル円 <span class="flat">(${md(usdjpy.date)})</span>`, fmt(usdjpy.last, 2), chg(usdjpy.chg, 2, "円")),
      us10 && tile(`米10年債 <span class="flat">(${md(us10.date)})</span>`, fmt(us10.last, 2) + "%", chg(us10.chg, 1, "bp")),
      jgb10 && tile(`日本10年債 <span class="flat">(${md(jgb10.date)})</span>`, fmt(jgb10.last, 3) + "%", chg(jgb10.chg, 1, "bp")),
      vix && tile(`VIX <span class="flat">(${md(vix.date)})</span>`, fmt(vix.last, 1), chg(vix.chg_pct, 1)),
      d.spread_us_jp_10y && tile("日米10年金利差", fmt(d.spread_us_jp_10y.value, 2) + "%", `<span class="flat">米${md(d.spread_us_jp_10y.us_date)}・日${md(d.spread_us_jp_10y.jp_date)}</span>`),
    ].filter(Boolean).join("");

    const jpEq = d.equities.filter(e => e.region === "JP"), usEq = d.equities.filter(e => e.region === "US");
    const labor = d.us_labor || {};
    const jpCpi = (d.jp_inflation || []).filter(x => x.key.startsWith("jp_cpi"));

    document.getElementById("app").innerHTML = `
      <section>
        <div class="hero">
          <div>
            <p class="headline">${esc(c.headline || "")}</p>
          </div>
          <span class="mood ${moodCls}" title="米株・VIX・急変動から機械的に判定">${moodIcon} 地合い: ${esc(c.mood || "—")}</span>
        </div>
        <div class="tiles">${tiles}</div>
      </section>

      <section>
        <h2>今朝のポイント <small>データから自動生成</small></h2>
        <ul class="points">${c.points.map(p => `<li><span class="tag ${p.tone === "pos" ? "pos" : p.tone === "neg" ? "neg" : ""}">${esc(p.tag)}</span><span>${esc(p.text)}</span></li>`).join("")}</ul>
      </section>

      <div class="stack">
        <section><h2>米国株 <small>前日のNY市場</small></h2>${priceTable(usEq)}</section>
        <section><h2>日本株 <small>前日の東京市場・CME先物</small></h2>${priceTable(jpEq)}</section>
        <section><h2>為替・商品・ボラティリティ</h2>${priceTable(d.markets, { unitCol: true })}</section>
      </div>

      <div class="stack">
        <section><h2>米国の金利</h2>${rateTable(d.us_rates)}</section>
        <section><h2>日本の金利</h2>${rateTable(d.jp_rates)}
          <p class="note">無担保コール翌日物は日銀の政策金利（誘導目標）の実績値。日銀の公表は数営業日遅れます。</p></section>
      </div>

      <div class="grid2">
        <section><h2>米国債イールドカーブ <small>${md(d.us_curve?.date)}</small></h2>
          <div class="legend"><span><i style="border-color:var(--series-1)"></i>最新</span><span><i class="dash" style="border-color:var(--text-3)"></i>1ヵ月前</span></div>
          <div class="chart" id="us-curve"></div></section>
        <section><h2>日本国債イールドカーブ <small>${md(d.jp_curve?.date)}</small></h2>
          <div class="legend"><span><i style="border-color:var(--series-2)"></i>最新</span><span><i class="dash" style="border-color:var(--text-3)"></i>1ヵ月前</span></div>
          <div class="chart" id="jp-curve"></div></section>
      </div>

      <section style="margin-top:16px"><h2>米国の物価</h2>
        <div class="grid2">
          <div style="min-width:0">${inflTable(d.us_inflation)}</div>
          <div style="min-width:0">
            <div class="legend"><span><i style="border-color:var(--series-1)"></i>CPI 総合</span><span><i style="border-color:var(--series-2)"></i>PCE コア</span><span><i class="dash" style="border-color:var(--text-3)"></i>FRB目標 2%</span></div>
            <div class="chart" id="us-infl"></div>
            <p class="note">前年比（%）の推移</p>
          </div>
        </div>
      </section>

      <div class="grid2">
        <section><h2>米国の雇用</h2>
          <div class="tiles">
            ${labor.unrate ? tile(`失業率 <span class="flat">(${ym(labor.unrate.date)})</span>`, fmt(labor.unrate.last, 1) + "%",
              `前月 ${fmt(labor.unrate.prev, 1)}% · 12ヵ月最低 ${fmt(labor.unrate.low12m, 1)}%`) : ""}
            ${labor.nfp ? tile(`非農業部門雇用者数 <span class="flat">(${ym(labor.nfp.date)})</span>`, (labor.nfp.last > 0 ? "+" : "") + fmt(labor.nfp.last, 0) + "千人",
              `3ヵ月平均 ${fmt(labor.nfp.avg3m, 0)}千人`) : ""}
          </div>
          ${labor.unrate && isNum(labor.unrate.last) && isNum(labor.unrate.low12m) && labor.unrate.last - labor.unrate.low12m >= 0.5
            ? '<p class="callout">⚠ 失業率が12ヵ月最低から0.5pt以上上昇（サーム・ルール的な景気後退シグナルに注意）。</p>' : ""}
          <div class="chart" id="us-unrate" style="margin-top:8px"></div>
          <p class="note">失業率の推移（%）</p>
        </section>
        <section><h2>日本の物価</h2>
          ${(d.jp_inflation || []).length ? inflTable(d.jp_inflation) : ""}
          ${!jpCpi.length ? `<p class="callout">消費者物価指数（全国）は e-Stat API のアプリケーションID（無料）を設定すると自動取得されます。
            設定方法は <code>market/README.md</code> を参照。最新値は <a href="https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html" target="_blank" rel="noopener">総務省統計局</a> で確認できます。</p>` : ""}
        </section>
      </div>

      <div style="height:16px"></div>

      <section><h2>リンク</h2>
        <div class="links">
          <a href="https://www.cmegroup.com/ja/markets/interest-rates/cme-fedwatch-tool.html" target="_blank" rel="noopener">CME FedWatch（利下げ確率）</a>
          <a href="https://jp.investing.com/economic-calendar/" target="_blank" rel="noopener">経済指標カレンダー</a>
          <a href="https://www.boj.or.jp/mopo/mpmsche_minu/index.htm" target="_blank" rel="noopener">日銀 金融政策決定会合</a>
          <a href="https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm" target="_blank" rel="noopener">FOMC 日程</a>
          <a href="https://www.jpx.co.jp/markets/statistics-equities/investor-type/index.html" target="_blank" rel="noopener">投資部門別売買状況</a>
          <a href="https://www.mof.go.jp/jgbs/reference/interest_rate/index.htm" target="_blank" rel="noopener">財務省 国債金利</a>
        </div>
      </section>

      ${(d.errors || []).length ? `<details><summary>取得できなかったデータ (${d.errors.length})</summary><ul class="note">${d.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></details>` : ""}
    `;

    // charts
    const curve = (id, cv, color) => {
      if (!cv || !cv.points?.length) return;
      lineChart(document.getElementById(id), {
        yUnit: "%", height: 200, yDigits: 3,
        series: [
          { name: "1ヵ月前", color: "var(--text-3)", dash: true, points: cv.points.map(p => [p[0], p[2]]) },
          { name: "最新", color, points: cv.points.map(p => [p[0], p[1]]) },
        ],
      });
    };
    curve("us-curve", d.us_curve, "var(--series-1)");
    curve("jp-curve", d.jp_curve, "var(--series-2)");
    const cpi = get(d.us_inflation, "CPIAUCSL"), pce = get(d.us_inflation, "PCEPILFE");
    if (cpi || pce) lineChart(document.getElementById("us-infl"), {
      xIsDate: true, yUnit: "%", height: 200, refLine: 2, yDigits: 1,
      series: [
        cpi && { name: "CPI 総合", color: "var(--series-1)", points: cpi.history },
        pce && { name: "PCE コア", color: "var(--series-2)", points: pce.history },
      ].filter(Boolean),
    });
    if (labor.unrate) lineChart(document.getElementById("us-unrate"), {
      xIsDate: true, yUnit: "%", height: 160, yDigits: 1,
      series: [{ name: "失業率", color: "var(--series-1)", points: labor.unrate.history }],
    });
  }

  fetch("data.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(err => {
      document.getElementById("app").innerHTML = `<p class="skeleton">データを読み込めませんでした（${esc(err.message)}）。</p>`;
      document.getElementById("generated").textContent = "";
    });
})();
</script>
</body>
</html>
